name: Update README repo list

on:
  schedule:
    - cron: "0 6 * * *"   # once a day at 06:00 UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "README.md"          # avoid infinite loop when the bot itself commits

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update repo list in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: quinnuk
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update repo list"
          git push
